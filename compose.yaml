services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mizan
      POSTGRES_DB: mizan
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run scripts/bootstrap.ps1}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U mizan']
      interval: 5s
      retries: 12
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://mizan:${POSTGRES_PASSWORD}@db:5432/mizan
      DEMO_PASSWORD: ${DEMO_PASSWORD:?Run scripts/bootstrap.ps1}
      EVIDENCE_KEY: ${EVIDENCE_KEY:?Run scripts/bootstrap.ps1}
      EVIDENCE_DIR: /app/data/evidence
      APP_ORIGIN: http://localhost:8080
      SECURE_COOKIES: 'false'
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evidence:/app/data/evidence
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 10s
      retries: 12
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - 127.0.0.1:8080:8080
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  evidence:
